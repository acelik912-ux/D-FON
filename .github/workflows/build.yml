name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: İnternet yalnızca hava durumu için mi, doğrula
        # İnternet izni yalnızca hava durumu widget'ı (Open-Meteo) için var.
        # Kodda bağlantı açan başka bir yer çıkarsa derleme durur.
        run: |
          bad=$(grep -rln "openConnection\|HttpURLConnection\|OkHttp\|Socket(" app/src/main/java | grep -v "WeatherWidget.kt" || true)
          if [ -n "$bad" ]; then echo "Hava dışında ağ bağlantısı: $bad"; exit 1; fi
          if grep -o 'https\?://[a-zA-Z0-9.-]*' app/src/main/java/com/acelik/asistan/WeatherWidget.kt | grep -v "api.open-meteo.com"; then
            echo "Hava widget'ı Open-Meteo dışında bir adrese bağlanıyor"; exit 1; fi

      - name: Testleri çalıştır
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk D-FON.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: D-FON 1.0.${{ github.run_number }}
          files: D-FON.apk
          make_latest: true
